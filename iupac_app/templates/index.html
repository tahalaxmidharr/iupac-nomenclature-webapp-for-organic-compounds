
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Organic Compound IUPAC Namer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            text-align: center;
            margin: 0;
            padding: 30px 15px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: inline-block;
            max-width: 95%;
            box-sizing: border-box;
        }

        #jsme_container {
            width: 500px;
            height: 350px;
            max-width: 100%;
            margin: 20px auto;
            border: 1px solid #ccc;
            border-radius: 5px;
            background: white;
            overflow: hidden;
        }

        .btn {
            background-color: #007BFF;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: #0056b3;
        }

        .btn:disabled {
            background-color: #888;
            cursor: not-allowed;
        }

        #status {
            margin: 15px auto;
            color: #555;
            font-size: 14px;
        }

        #output-section {
            margin-top: 25px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 5px;
            text-align: left;
            overflow-wrap: anywhere;
            display: none;
        }

        #iupac-result {
            font-weight: bold;
            font-size: 18px;
        }

        @media (max-width: 550px) {
            #jsme_container {
                width: 100%;
            }
        }
    </style>

    <!-- Load JSME chemical drawing editor -->
    <script
    src="https://cdn.jsdelivr.net/npm/jsme-editor@2024.4.29/jsme.nocache.js">
</script>

    <script>
        let jsmeApplet = null;

        // JSME calls this function after its library loads.
        function jsmeOnLoad() {
            console.log("JSME load callback called.");

            try {

jsmeApplet = new JSApplet.JSME(
    "jsme_container",
    "500px",
    "350px",
    {
        options: "oldlook,star"
    }
);


                document.getElementById("status").textContent =
                    "Editor loaded. Draw your molecule below.";

                console.log("JSME editor initialized.");
            } catch (error) {
                console.error("JSME initialization failed:", error);

                document.getElementById("status").textContent =
                    "Could not initialize the editor. Check the browser console.";
            }
        }

        // Submit the drawn structure to the Python backend.
        async function processDrawing() {
            if (!jsmeApplet) {
                alert(
                    "The drawing editor has not loaded yet. " +
                    "Please check the browser console."
                );
                return;
            }

            let smiles;

            try {
                smiles = jsmeApplet.smiles();
            } catch (error) {
                console.error("Could not read the drawing:", error);
                alert("Could not read the chemical structure.");
                return;
            }

            // An empty drawing normally produces an empty SMILES string.
            if (!smiles || !smiles.trim()) {
                alert("Please draw a chemical structure first.");
                return;
            }

            const output = document.getElementById("output-section");
            const smilesResult = document.getElementById("smiles-result");
            const iupacResult = document.getElementById("iupac-result");
            const button = document.getElementById("name-button");

            output.style.display = "block";
            smilesResult.textContent = smiles;
            iupacResult.textContent = "Looking up IUPAC name...";
            iupacResult.style.color = "#333";
            button.disabled = true;

            try {
                const response = await fetch("/get-iupac", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ smiles: smiles })
                });

                if (!response.ok) {
                    throw new Error(
                        "Backend returned HTTP " + response.status
                    );
                }

                const data = await response.json();

                if (data.iupac_name) {
                    iupacResult.textContent = data.iupac_name;
                    iupacResult.style.color = "#27ae60";
                } else {
                    iupacResult.textContent =
                        "Error: " + (data.error || "No name returned.");
                    iupacResult.style.color = "#c0392b";
                }
            } catch (error) {
                console.error("Naming request failed:", error);

                iupacResult.textContent =
                    "Could not contact the naming backend. " +
                    "Check that your Python server is running.";
                iupacResult.style.color = "#c0392b";
            } finally {
                button.disabled = false;
            }
        }
    </script>
</head>

<body>
    <div class="card">
        <h1>Organic Compound IUPAC Namer</h1>

        <p>Draw your chemical structure, then click the button.</p>

        <div id="jsme_container"></div>

        <p id="status">Loading chemical drawing editor...</p>

        <button
            class="btn"
            id="name-button"
            onclick="processDrawing()">
            Give IUPAC Name
        </button>

        <div id="output-section">
            <p>
                <strong>Generated SMILES:</strong>
                <span id="smiles-result"></span>
            </p>

            <p>
                <strong>IUPAC Name:</strong>
                <span id="iupac-result"></span>
            </p>
        </div>
    </div>
</body>
</html>
